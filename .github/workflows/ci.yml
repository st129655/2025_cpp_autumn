name: Windows CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build and Run HW1
      shell: pwsh
      run: |
        cd 2025.09.20_HW1
        cmake -B build -S .
        cmake --build build
        if (Test-Path "build/Debug/hw1.exe") { 
          build/Debug/hw1.exe 
        } else { 
          build/hw1.exe 
        }
    
    - name: Build and Run HW2
      shell: pwsh  
      run: |
        cd 2025.09.28_HW2
        cmake -B build -S .
        cmake --build build
        if (Test-Path "build/Debug/hw2.exe") { 
          build/Debug/hw2.exe 
        } else { 
          build/hw2.exe 
        }
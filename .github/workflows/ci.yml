name: Windows CI

on:
  push:
    branches: [ main, ci_test ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug - Show files structure
      shell: cmd
      run: |
        echo Current directory:
        cd
        echo Files list:
        dir

    - name: Debug - Show CMake version
      run: cmake --version

    - name: Configure with CMake
      run: cmake -B build -S .

    - name: Build project
      run: cmake --build build --config Release

    - name: Run application
      run: .\build\Release\main.exe
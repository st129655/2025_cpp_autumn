name: Windows CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build and Run HW1
      shell: pwsh
      run: |
        cd 2025.09.20_HW1
        cmake -B build -S .
        cmake --build build
        if (Test-Path "build/Debug/hw1.exe") { 
          build/Debug/hw1.exe 
        } else { 
          build/hw1.exe 
        }
    
    - name: Build and Run HW2
      shell: pwsh  
      run: |
        cd 2025.09.28_HW2
        cmake -B build -S .
        cmake --build build
        if (Test-Path "build/Debug/hw2.exe") { 
          build/Debug/hw2.exe 
        } else { 
          build/hw2.exe 
        }

    - name: Build and Run HW3
      shell: pwsh  
      run: |
        cd 2025.10.04_HW3
        cmake -B build -S .
        cmake --build build
        if (Test-Path "build/Debug/hw3.exe") { 
          build/Debug/hw3.exe 
        } else { 
          build/hw3.exe 
        }
        
    - name: Build and Run HW4
      shell: pwsh  
      run: |
        cd 2025.10.11_HW4
        cmake -B build -S .
        cmake --build build
        if (Test-Path "build/Debug/hw4.exe") { 
          build/Debug/hw4.exe 
        } else { 
          build/hw4.exe 
        }
        
    - name: Install GoogleTest for HW5
      shell: pwsh
      run: |
        cd 2025.10.18_HW5
        vcpkg install gtest:x64-windows
        
    - name: Build and Run HW5
      shell: pwsh  
      run: |
        cd 2025.10.18_HW5
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
        cmake --build build
        if (Test-Path "build/Debug/hw5.exe") { 
          build/Debug/hw5.exe 
        } elseif (Test-Path "build/Release/hw5.exe") {
          build/Release/hw5.exe
        } else { 
          build/hw5.exe 
        }